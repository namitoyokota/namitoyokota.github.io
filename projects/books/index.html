<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Namito’s Virtual Bookshelf</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f8f8f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:inherit}header{height:70px;background:#fff;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1200px)/2))}.brand{display:flex;gap:11px;align-items:center;font-weight:750;letter-spacing:-.04em;font-size:19px;text-decoration:none}.logo{width:30px;height:30px;background:#18181b;color:#fff;border-radius:8px;display:grid;place-items:center;font-size:18px}.topnote{color:#737373;font-size:13px}main{max-width:1200px;margin:0 auto;padding:44px 24px 80px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:22px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:750;color:#8b6b53}h1{font-size:clamp(34px,5vw,58px);letter-spacing:-.065em;line-height:1.05;margin:11px 0 12px;font-weight:720}.sub{color:#666;line-height:1.55;margin:0;font-size:15px}.setup{margin:30px 0 28px;background:#fff;border:1px solid #e7e5e4;border-radius:15px;padding:22px;box-shadow:0 5px 25px #18181806;display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center}.setup strong{font-size:16px}.setup p{margin:6px 0 0;color:#737373;font-size:14px;line-height:1.5}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{height:40px;border:1px solid #dedede;background:#fff;border-radius:8px;padding:0 15px;font-size:14px;font-weight:620;white-space:nowrap}.btn:hover,.tab:hover{background:#f4f4f4}.btn.primary{background:#1c1c1c;color:#fff;border-color:#1c1c1c}.btn.primary:hover{background:#383838}.btn:focus-visible,.tab:focus-visible,.book:focus-visible,input:focus-visible,.close:focus-visible{outline:3px solid #b09276;outline-offset:3px}.profileform{display:flex;gap:9px;margin:15px 0 0}.profileform input{width:min(350px,100%);border:1px solid #dedede;border-radius:8px;padding:9px 12px;background:white;font-size:14px}.profileform .btn{flex-shrink:0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px;flex-wrap:wrap}.tabs{display:flex;gap:5px;padding:4px;background:#eee;border-radius:9px;overflow-x:auto;max-width:100%}.tab{border:0;border-radius:7px;padding:9px 13px;background:transparent;color:#666;font-size:14px;font-weight:600;white-space:nowrap}.tab[aria-selected=true]{background:#fff;color:#191919;box-shadow:0 1px 4px #00000012}.count{color:#737373;font-size:14px}#shelf{min-height:280px}.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));column-gap:25px;row-gap:36px;padding:12px 10px 30px;border-bottom:11px solid #d8cec4;box-shadow:0 7px 0 #b3a49a,0 15px 13px -12px #0004}.book{text-align:left;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:stretch;min-width:0;color:inherit}.cover{position:relative;aspect-ratio:2/3;max-width:165px;width:100%;display:flex;flex-direction:column;justify-content:space-between;background:var(--cover);color:white;border-radius:3px;padding:19px 14px 15px 18px;box-shadow:0 2px 9px #00000020;overflow:hidden;transition:transform .18s,box-shadow .18s}.book:hover .cover{transform:translateY(-6px);box-shadow:0 8px 20px #00000025}.coverimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:inherit;background:#fff}.cover .ornament{width:32px;height:3px;background:#ffffff9e}.cover .ctitle{font-family:Georgia,serif;font-size:clamp(16px,1.6vw,21px);line-height:1.13;font-weight:bold;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}.cover .cauthor{font-size:11px;text-transform:uppercase;letter-spacing:.1em;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.bookname{font-size:14px;font-weight:650;margin:12px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:165px}.author{font-size:13px;color:#737373;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:165px}.rating{color:#a36b29;font-size:13px;margin-top:6px;letter-spacing:.05em}.empty{padding:55px 20px;border:1px dashed #d6d3d1;border-radius:12px;text-align:center;color:#737373;background:#fff}.empty h2{font-size:19px;color:#282828;letter-spacing:-.03em;margin:0 0 8px}.empty p{margin:0;line-height:1.5}.hint{font-size:12px;color:#999;margin-top:24px;line-height:1.5}.dialogback{position:fixed;inset:0;background:#18181899;z-index:5;display:grid;place-items:center;padding:16px}.dialog{background:#fff;width:min(650px,100%);max-height:min(85vh,780px);overflow:auto;border-radius:15px;box-shadow:0 20px 90px #0004;padding:30px;position:relative}.close{position:absolute;right:17px;top:14px;background:transparent;border:0;font-size:27px;color:#777;line-height:1}.dialog h2{font-family:Georgia,serif;letter-spacing:-.035em;font-size:30px;margin:0 38px 4px 0}.dialog .by{color:#6f6f6f;margin:0 0 17px}.pill{font-size:12px;background:#f4f2ef;border-radius:99px;padding:6px 10px;display:inline-block;margin-right:6px}.dialog h3{font-size:13px;text-transform:uppercase;letter-spacing:.1em;margin:25px 0 10px;color:#777}.review{white-space:pre-wrap;line-height:1.75;overflow-wrap:anywhere}.error{color:#a4342a!important}footer{max-width:1200px;margin:auto;padding:15px 24px 35px;color:#999;font-size:12px}footer a{text-decoration:underline}@media(max-width:700px){header{padding:0 20px}.topnote{display:none}main{padding:32px 18px}.setup{grid-template-columns:1fr}.bookgrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:25px 16px}.cover{aspect-ratio:2/3}.profileform{flex-wrap:wrap}.dialog{padding:23px}}
</style>
</head>
<body>
<header><a class="brand" href="./"><span class="logo" aria-hidden="true">◧</span> Namito’s Virtual Bookshelf</a><span class="topnote">A collection of books and reviews</span></header>
<main>
<div class="intro"><div><div class="eyebrow">A reading collection</div><h1 id="heading">Namito’s Virtual Bookshelf</h1><p class="sub" id="subtitle">Books I’ve read, books I’m reading, and what’s next.</p></div></div>
<div class="toolbar"><div class="tabs" role="tablist" aria-label="Bookshelf filter"><button class="tab" role="tab" data-shelf="read" aria-selected="true">Read</button><button class="tab" role="tab" data-shelf="currently-reading" aria-selected="false">Currently reading</button><button class="tab" role="tab" data-shelf="to-read" aria-selected="false">Want to read</button></div><span id="count" class="count" aria-live="polite"></span></div>
<div id="shelf" aria-live="polite"><div class="empty"><h2>Loading bookshelf…</h2></div></div>
</main><footer>Made for sharing · Book data from my Goodreads export · Covers courtesy of <a href="https://openlibrary.org/" target="_blank" rel="noopener noreferrer">Open Library</a>.</footer>
<div id="modal" hidden></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), state={books:[],shelf:'read',error:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const rows=[],row=[];let cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row.slice());row.length=0;cell=''}else cell+=c}if(quoted)throw Error('The CSV has an unfinished quoted field.');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows}
function normalize(rows){if(!rows.length)throw Error('This CSV is empty.');let keys=rows.shift().map(x=>x.trim().toLowerCase()),index=k=>keys.indexOf(k.toLowerCase()),get=(row,key)=>row[index(key)]?.trim()||'';if(index('Title')<0||index('Exclusive Shelf')<0)throw Error('This does not look like a Goodreads library export. Expected Title and Exclusive Shelf columns.');return rows.filter(row=>get(row,'Title')).map((row,i)=>({id:get(row,'Book Id')||String(i),title:get(row,'Title'),author:get(row,'Author'),rating:Math.min(5,Math.max(0,Number(get(row,'My Rating'))||0)),shelf:get(row,'Exclusive Shelf').toLowerCase(),review:get(row,'My Review'),isbn:(get(row,'ISBN13')||get(row,'ISBN')).replace(/[^0-9Xx]/g,''),date:get(row,'Date Read')}))}
function render(){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.shelf===state.shelf)));let books=state.books.filter(b=>b.shelf===state.shelf);$('#count').textContent=state.error?'':books.length+' '+(books.length===1?'book':'books');if(!books.length){$('#shelf').innerHTML=`<div class="empty"><h2>${state.error?'Could not load the bookshelf':state.books.length?'No books on this shelf yet.':'The bookshelf is empty.'}</h2><p>${esc(state.error|| (state.books.length?'Explore another shelf.':'Check back soon.'))}</p></div>`;return}const colors=['#534739','#354957','#765747','#394f4d','#624a63','#765f3f','#49546a','#66433c','#3e5a53'];$('#shelf').innerHTML='<div class="bookgrid">'+books.map(b=>{let index=state.books.indexOf(b),color=colors[Array.from(b.title).reduce((a,c)=>a+c.charCodeAt(0),0)%colors.length];let isbn=/^(?:[0-9]{13}|[0-9]{9}[0-9X])$/.test(b.isbn||'')?b.isbn:'';return `<button class="book" type="button" data-index="${index}" aria-label="View ${esc(b.title)} by ${esc(b.author)}"><span class="cover" style="--cover:${color}"><span class="ornament"></span><span class="ctitle">${esc(b.title)}</span><span class="cauthor">${esc(b.author)}</span>${isbn?`<img class="coverimg" src="https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false" loading="lazy" decoding="async" alt="" onerror="this.remove()">`:''}</span><span class="bookname">${esc(b.title)}</span><span class="author">${esc(b.author)}</span><span class="rating">${b.rating?'★'.repeat(b.rating)+'☆'.repeat(5-b.rating):'Not rated'}</span></button>`}).join('')+'</div>'}
function openBook(b){let labels={'read':'Read','currently-reading':'Currently reading','to-read':'Want to read'};$('#modal').innerHTML=`<div class="dialogback"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><button class="close" type="button" aria-label="Close details">×</button><h2 id="dialogTitle">${esc(b.title)}</h2><p class="by">by ${esc(b.author||'Unknown author')}</p><span class="pill">${esc(labels[b.shelf]||b.shelf)}</span><span class="pill">${b.rating?`${'★'.repeat(b.rating)}${'☆'.repeat(5-b.rating)} · ${b.rating}/5`:'Not rated'}</span>${b.date?`<span class="pill">Read ${esc(b.date)}</span>`:''}<h3>Review</h3><div class="review">${b.review?esc(b.review):'<span style="color:#777">No written review for this book.</span>'}</div></section></div>`;$('#modal').hidden=false;$('.close').focus()}
document.querySelector('.tabs').addEventListener('click',e=>{let b=e.target.closest('[data-shelf]');if(b){state.shelf=b.dataset.shelf;render()}});$('#shelf').addEventListener('click',e=>{let b=e.target.closest('[data-index]');if(b)openBook(state.books[Number(b.dataset.index)])});$('#modal').addEventListener('click',e=>{if(e.target.classList.contains('dialogback')||e.target.classList.contains('close'))$('#modal').hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').hidden=true});render();fetch('export.csv',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('export.csv is missing. Place it beside index.html.');return r.text()}).then(csv=>{state.books=normalize(parseCSV(csv));state.error='';render()}).catch(err=>{state.error=location.protocol==='file:'?'Open this site through a local or hosted web server so the browser can read export.csv.':err.message;render()})
})();
</script>
</body></html>
